name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Install frozen contract dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r contracts/requirements.lock.txt
          npm --prefix contracts ci --ignore-scripts
      - name: Verify exact approved contract without updating the ledger
        run: .venv/bin/python scripts/verify_g0.py

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_REKNYX_MODE: preview
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - run: npm --prefix frontend ci
      - name: Verify generated API schemas and frontend behavior
        run: |
          node frontend/scripts/generate-api.mjs --check
          npm --prefix frontend run typecheck
          npm --prefix frontend test
          npm --prefix frontend run test:contract
          npm --prefix frontend run test:client
          npm --prefix frontend run build
      - name: Install compatible Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify synthetic preview in browser
        run: npm --prefix frontend run test:e2e

  compose-integration:
    needs: [contracts, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Install frozen backend and browser dependencies
        run: |
          python -m pip install uv==0.9.11
          uv sync --project backend --frozen
          npm --prefix frontend ci
      - name: Install PDF text extraction for report assertions
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
      - name: Install compatible Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build, migrate, test actual HTTP, and verify clean restart persistence
        run: bash scripts/ci/compose-check.sh
      # Browser traces can contain generated login credentials. Do not upload them.
